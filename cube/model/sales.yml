# Πωλήσεις & αγορές από τα παραστατικά (sales_docs / purchase_docs).
# doc_series (built by the app) keeps only invoicing series: sign 1 = τιμολόγιο/απόδειξη,
# -1 = πιστωτικό/επιστροφή; orders, offers and delivery notes are excluded.

cubes:
  - name: sales
    title: Πωλήσεις
    description: Παραστατικά τιμολόγησης πωλήσεων (καθαρή αξία, πιστωτικά αφαιρούνται).
    sql: >
      SELECT d.findoc, d.trndate, d.fiscprd, d.branch, d.trdr, s.sign,
             d.netamnt * s.sign AS net, d.vatamnt * s.sign AS vat, d.sumamnt * s.sign AS gross,
             s.name AS series_name, c.code AS customer_code, c.name AS customer_name, c.city AS customer_city
      FROM sales_docs d
      JOIN doc_series s ON s.series = d.series AND s.sign <> 0
      LEFT JOIN customers c ON c.trdr = d.trdr
      WHERE COALESCE(d.iscancel, 0) = 0

    measures:
      - name: net
        title: Καθαρές πωλήσεις
        type: sum
        sql: net

      - name: gross
        title: Πωλήσεις με ΦΠΑ
        type: sum
        sql: gross

      - name: vat
        title: ΦΠΑ
        type: sum
        sql: vat

      - name: invoices
        title: Τιμολόγια / αποδείξεις
        type: count
        filters:
          - sql: "{CUBE}.sign = 1"

      - name: credit_notes
        title: Πιστωτικά / επιστροφές
        type: count
        filters:
          - sql: "{CUBE}.sign = -1"

      - name: returns
        title: Αξία πιστωτικών
        type: sum
        sql: "-{CUBE}.net"
        filters:
          - sql: "{CUBE}.sign = -1"

      - name: customers
        title: Ενεργοί πελάτες
        type: count_distinct
        sql: trdr

      - name: avg_invoice
        title: Μέση αξία παραστατικού
        type: number
        sql: "{net} / NULLIF({invoices}, 0)"

    dimensions:
      - name: findoc
        sql: findoc
        type: number
        primary_key: true
        public: false

      - name: date
        title: Ημερομηνία
        type: time
        sql: trndate

      - name: fiscal_year
        title: Χρήση
        type: number
        sql: fiscprd

      - name: series_name
        title: Σειρά
        type: string
        sql: series_name

      - name: customer_code
        title: Κωδικός πελάτη
        type: string
        sql: customer_code

      - name: customer_name
        title: Πελάτης
        type: string
        sql: COALESCE(customer_name, 'Λιανική / χωρίς πελάτη')

      - name: customer_city
        title: Πόλη
        type: string
        sql: customer_city

      - name: branch
        title: Υποκατάστημα
        type: number
        sql: branch

  - name: purchases
    title: Αγορές
    description: Παραστατικά τιμολόγησης αγορών (καθαρή αξία, πιστωτικά αφαιρούνται).
    sql: >
      SELECT d.findoc, d.trndate, d.fiscprd, d.branch, d.trdr, s.sign,
             d.netamnt * s.sign AS net, d.vatamnt * s.sign AS vat, d.sumamnt * s.sign AS gross,
             s.name AS series_name, p.code AS supplier_code, p.name AS supplier_name, p.city AS supplier_city
      FROM purchase_docs d
      JOIN doc_series s ON s.series = d.series AND s.sign <> 0
      LEFT JOIN suppliers p ON p.trdr = d.trdr
      WHERE COALESCE(d.iscancel, 0) = 0

    measures:
      - name: net
        title: Καθαρές αγορές
        type: sum
        sql: net

      - name: gross
        title: Αγορές με ΦΠΑ
        type: sum
        sql: gross

      - name: invoices
        title: Τιμολόγια αγοράς
        type: count
        filters:
          - sql: "{CUBE}.sign = 1"

      - name: suppliers
        title: Ενεργοί προμηθευτές
        type: count_distinct
        sql: trdr

    dimensions:
      - name: findoc
        sql: findoc
        type: number
        primary_key: true
        public: false

      - name: date
        title: Ημερομηνία
        type: time
        sql: trndate

      - name: fiscal_year
        title: Χρήση
        type: number
        sql: fiscprd

      - name: series_name
        title: Σειρά
        type: string
        sql: series_name

      - name: supplier_code
        title: Κωδικός προμηθευτή
        type: string
        sql: supplier_code

      - name: supplier_name
        title: Προμηθευτής
        type: string
        sql: COALESCE(supplier_name, '—')

      - name: supplier_city
        title: Πόλη
        type: string
        sql: supplier_city
