# Επιχειρηματική ευφυΐα — cubes over the analytic marts the app builds hourly (lib/bi-marts.ts,
# lib/bi-ledger.ts) in the tenant schema. Titles/descriptions are in Greek: the AI agent reads
# them from /meta to choose the right measure. Amounts are € (company currency), net of VAT.

cubes:
  # ───────────────────────── Γραμμές πωλήσεων (ανά είδος) ─────────────────────────
  - name: sales_lines
    title: Πωλήσεις ανά είδος
    description: >
      Κάθε γραμμή τιμολογίου/απόδειξης πώλησης με είδος, κατηγορία, ομάδα, μάρκα, πελάτη, πωλητή και
      αποθήκη. Τζίρος = καθαρή αξία· κόστος από το κόστος είδους της χρήσης· μικτό κέρδος = τζίρος − κόστος.
      Πιστωτικά/επιστροφές με αρνητικό πρόσημο.
    sql: >
      SELECT f.*, i.code AS item_code, i.name AS item_name,
             c.name AS category_name, g.name AS group_name, b.name AS brand_name,
             cu.code AS customer_code, cu.name AS customer_name, cu.city AS customer_city,
             TRIM(COALESCE(sm.name, '') || ' ' || COALESCE(sm.name2, '')) AS salesman_name,
             w.name AS warehouse_name
      FROM f_sales_lines f
      LEFT JOIN items i ON i.mtrl = f.mtrl
      LEFT JOIN item_categories c ON c.mtrcategory = i.mtrcategory
      LEFT JOIN item_groups g ON g.mtrgroup = i.mtrgroup
      LEFT JOIN brands b ON b.mtrmark = i.mtrmark
      LEFT JOIN customers cu ON cu.trdr = f.trdr
      LEFT JOIN salesmen sm ON sm.prsn = f.salesman
      LEFT JOIN warehouses w ON w.whouse = f.whouse

    measures:
      - name: revenue
        title: Τζίρος
        description: Καθαρή αξία πωλήσεων (χωρίς ΦΠΑ), μείον πιστωτικά.
        type: sum
        sql: net
      - name: cost
        title: Κόστος πωληθέντων
        type: sum
        sql: cost
      - name: revenue_costed
        title: Τζίρος με γνωστό κόστος
        type: sum
        sql: net
        filters:
          - sql: "{CUBE}.cost IS NOT NULL"
      - name: margin
        title: Μικτό κέρδος
        description: Τζίρος − κόστος, μόνο για γραμμές με γνωστό κόστος είδους.
        type: number
        sql: "{revenue_costed} - {cost}"
      - name: margin_pct
        title: Περιθώριο μικτού κέρδους %
        description: Μικτό κέρδος ως ποσοστό του τζίρου (ποσοστό κέρδους).
        type: number
        sql: "100.0 * ({revenue_costed} - {cost}) / NULLIF({revenue_costed}, 0)"
      - name: markup_pct
        title: Markup %
        description: Μικτό κέρδος ως ποσοστό του κόστους.
        type: number
        sql: "100.0 * ({revenue_costed} - {cost}) / NULLIF({cost}, 0)"
      - name: quantity
        title: Ποσότητα
        type: sum
        sql: qty
      - name: documents
        title: Παραστατικά
        type: count_distinct
        sql: findoc
      - name: customers
        title: Πελάτες
        type: count_distinct
        sql: trdr
      - name: items
        title: Διαφορετικά είδη
        type: count_distinct
        sql: mtrl
      - name: avg_price
        title: Μέση τιμή πώλησης
        type: number
        sql: "{revenue} / NULLIF({quantity}, 0)"

    dimensions:
      - name: line_key
        sql: "findoc::text || '-' || mtrlines::text"
        type: string
        primary_key: true
        public: false
      - name: date
        title: Ημερομηνία
        type: time
        sql: trndate
      - name: entry_time
        title: Ώρα καταχώρησης
        type: time
        sql: insdate
      - name: hour
        title: Ώρα της ημέρας
        type: number
        sql: "EXTRACT(HOUR FROM insdate)"
      - name: weekday
        title: Ημέρα εβδομάδας (1=Δευτέρα)
        type: number
        sql: "EXTRACT(ISODOW FROM trndate)"
      - name: fiscal_year
        title: Χρήση
        type: number
        sql: fiscprd
      - name: item_code
        title: Κωδικός είδους
        type: string
        sql: item_code
      - name: item_name
        title: Είδος
        type: string
        sql: COALESCE(item_name, '—')
      - name: category
        title: Εμπορική κατηγορία
        type: string
        sql: COALESCE(category_name, 'Χωρίς κατηγορία')
      - name: item_group
        title: Ομάδα ειδών
        type: string
        sql: COALESCE(group_name, 'Χωρίς ομάδα')
      - name: brand
        title: Μάρκα
        type: string
        sql: COALESCE(brand_name, 'Χωρίς μάρκα')
      - name: customer_code
        title: Κωδικός πελάτη
        type: string
        sql: customer_code
      - name: customer_name
        title: Πελάτης
        type: string
        sql: COALESCE(customer_name, 'Λιανική / χωρίς πελάτη')
      - name: customer_city
        title: Πόλη πελάτη
        type: string
        sql: customer_city
      - name: salesman
        title: Πωλητής
        type: string
        sql: COALESCE(NULLIF(salesman_name, ''), 'Χωρίς πωλητή')
      - name: warehouse
        title: Αποθήκη
        type: string
        sql: COALESCE(warehouse_name, whouse::text)

  # ───────────────────────── Γραμμές αγορών ─────────────────────────
  - name: purchase_lines
    title: Αγορές ανά είδος
    description: Γραμμές τιμολογίων αγοράς ανά είδος και προμηθευτή (καθαρή αξία, πιστωτικά αρνητικά).
    sql: >
      SELECT f.*, i.code AS item_code, i.name AS item_name, c.name AS category_name, b.name AS brand_name,
             s.name AS supplier_name
      FROM f_purchase_lines f
      LEFT JOIN items i ON i.mtrl = f.mtrl
      LEFT JOIN item_categories c ON c.mtrcategory = i.mtrcategory
      LEFT JOIN brands b ON b.mtrmark = i.mtrmark
      LEFT JOIN suppliers s ON s.trdr = f.trdr
    measures:
      - name: amount
        title: Αξία αγορών
        type: sum
        sql: net
      - name: quantity
        title: Ποσότητα
        type: sum
        sql: qty
      - name: avg_price
        title: Μέση τιμή αγοράς
        type: number
        sql: "{amount} / NULLIF({quantity}, 0)"
      - name: documents
        title: Τιμολόγια αγοράς
        type: count_distinct
        sql: findoc
    dimensions:
      - name: line_key
        sql: "findoc::text || '-' || mtrlines::text"
        type: string
        primary_key: true
        public: false
      - name: date
        title: Ημερομηνία
        type: time
        sql: trndate
      - name: item_code
        title: Κωδικός είδους
        type: string
        sql: item_code
      - name: item_name
        title: Είδος
        type: string
        sql: COALESCE(item_name, '—')
      - name: category
        title: Εμπορική κατηγορία
        type: string
        sql: COALESCE(category_name, 'Χωρίς κατηγορία')
      - name: brand
        title: Μάρκα
        type: string
        sql: COALESCE(brand_name, 'Χωρίς μάρκα')
      - name: supplier_name
        title: Προμηθευτής
        type: string
        sql: COALESCE(supplier_name, '—')

  # ───────────────────────── Είδη: κερδοφορία, ABC, απόθεμα, παραγγελίες ─────────────────────────
  - name: items
    title: Είδη — κερδοφορία, απόθεμα & παραγγελίες
    description: >
      Μία γραμμή ανά είδος με τελευταίους 12 μήνες: τζίρος, μικτό κέρδος, περιθώριο, ανάπτυξη έναντι
      προηγούμενων 12 μηνών, κατηγορία ABC (A = 80% του τζίρου), απόθεμα κύριας αποθήκης και αξία του,
      ημέρες κάλυψης, νεκρό απόθεμα (χωρίς πώληση για πολύ καιρό) και πρόταση παραγγελίας με βάση τη
      ζήτηση και τον χρόνο παράδοσης του προμηθευτή.
    sql: >
      SELECT m.*, i.code AS item_code, i.name AS item_name, c.name AS category_name, g.name AS group_name,
             b.name AS brand_name, s.name AS supplier_name
      FROM m_item_stats m
      LEFT JOIN items i ON i.mtrl = m.mtrl
      LEFT JOIN item_categories c ON c.mtrcategory = i.mtrcategory
      LEFT JOIN item_groups g ON g.mtrgroup = i.mtrgroup
      LEFT JOIN brands b ON b.mtrmark = i.mtrmark
      LEFT JOIN suppliers s ON s.trdr = m.main_supplier
    measures:
      - name: count
        title: Πλήθος ειδών
        type: count
      - name: revenue_12m
        title: Τζίρος 12μήνου
        type: sum
        sql: revenue_12m
      - name: revenue_prev_12m
        title: Τζίρος προηγούμενου 12μήνου
        type: sum
        sql: revenue_prev_12m
      - name: margin_12m
        title: Μικτό κέρδος 12μήνου
        type: sum
        sql: margin_12m
      - name: margin_pct
        title: Περιθώριο %
        type: number
        sql: "100.0 * SUM({CUBE}.margin_12m) / NULLIF(SUM({CUBE}.revenue_costed_12m), 0)"
      - name: stock_value
        title: Αξία αποθέματος
        description: Απόθεμα κύριας αποθήκης × κόστος είδους.
        type: sum
        sql: stock_value
      - name: stock_qty
        title: Ποσότητα αποθέματος
        type: sum
        sql: stock_qty
      - name: dead_stock_value
        title: Αξία νεκρού αποθέματος
        description: Αξία αποθέματος ειδών χωρίς πώληση πέρα από το όριο ημερών.
        type: sum
        sql: stock_value
        filters:
          - sql: "{CUBE}.dead_stock"
      - name: dead_stock_items
        title: Είδη νεκρού αποθέματος
        type: count
        filters:
          - sql: "{CUBE}.dead_stock"
      - name: suggested_order_qty
        title: Προτεινόμενη ποσότητα παραγγελίας
        type: sum
        sql: suggested_order_qty
      - name: suggested_order_value
        title: Αξία προτεινόμενης παραγγελίας
        type: sum
        sql: "suggested_order_qty * COALESCE(unit_cost, 0)"
      - name: items_to_order
        title: Είδη προς παραγγελία
        type: count
        filters:
          - sql: "{CUBE}.suggested_order_qty > 0"
    dimensions:
      - name: mtrl
        sql: mtrl
        type: number
        primary_key: true
        public: false
      - name: item_code
        title: Κωδικός είδους
        type: string
        sql: item_code
      - name: item_name
        title: Είδος
        type: string
        sql: COALESCE(item_name, '—')
      - name: category
        title: Εμπορική κατηγορία
        type: string
        sql: COALESCE(category_name, 'Χωρίς κατηγορία')
      - name: item_group
        title: Ομάδα ειδών
        type: string
        sql: COALESCE(group_name, 'Χωρίς ομάδα')
      - name: brand
        title: Μάρκα
        type: string
        sql: COALESCE(brand_name, 'Χωρίς μάρκα')
      - name: supplier
        title: Κύριος προμηθευτής
        type: string
        sql: supplier_name
      - name: abc
        title: Κατηγορία ABC
        description: A = είδη που κάνουν το 80% του τζίρου, B = επόμενο 15%, C = υπόλοιπα, N = χωρίς πωλήσεις.
        type: string
        sql: abc
      - name: dead_stock
        title: Νεκρό απόθεμα
        type: boolean
        sql: dead_stock
      - name: revenue
        title: Τζίρος 12μ (τιμή)
        type: number
        sql: revenue_12m
      - name: margin_percent
        title: Περιθώριο % (τιμή)
        type: number
        sql: margin_pct
      - name: growth_percent
        title: Ανάπτυξη % έναντι προηγ. 12μήνου
        type: number
        sql: growth_pct
      - name: stock
        title: Απόθεμα (τιμή)
        type: number
        sql: stock_qty
      - name: stock_amount
        title: Αξία αποθέματος (τιμή)
        type: number
        sql: stock_value
      - name: unit_cost
        title: Κόστος μονάδας
        type: number
        sql: unit_cost
      - name: days_of_cover
        title: Ημέρες κάλυψης
        description: Για πόσες ημέρες φτάνει το απόθεμα με τον μέσο ρυθμό πωλήσεων.
        type: number
        sql: days_of_cover
      - name: days_since_sale
        title: Ημέρες από την τελευταία πώληση
        type: number
        sql: days_since_sale
      - name: last_sale
        title: Τελευταία πώληση
        type: time
        sql: last_sale
      - name: lead_days
        title: Χρόνος παράδοσης (ημέρες)
        type: number
        sql: lead_days
      - name: reorder_point
        title: Σημείο αναπαραγγελίας
        type: number
        sql: reorder_point
      - name: order_qty
        title: Πρόταση παραγγελίας (τιμή)
        type: number
        sql: suggested_order_qty

  # ───────────────────────── Πελάτες: RFM, κίνδυνος, πληρωμές ─────────────────────────
  - name: customers
    title: Πελάτες — αξιολόγηση & πληρωμές
    description: >
      Μία γραμμή ανά πελάτη: τζίρος και κέρδος 12μήνου, ανάπτυξη, συχνότητα αγορών, κατηγορία RFM
      (Champions, Πιστοί, Σε κίνδυνο, Χαμένοι …), κίνδυνος απώλειας, υπόλοιπο, ληξιπρόθεσμα ανά ηλικία,
      μέσες ημέρες πληρωμής και βαθμολογία πληρωμών (Α–Δ).
    sql: >
      SELECT cs.*, c.code AS customer_code, c.name AS customer_name, c.city AS customer_city,
             pb.balance, pb.open_0_30, pb.open_31_60, pb.open_61_90, pb.open_90_plus, pb.oldest_open,
             pb.avg_payment_days, pb.paid_12m, pb.invoiced_12m, pb.last_payment, pb.dso_days, pb.payment_score, pb.payment_grade
      FROM m_customer_stats cs
      LEFT JOIN customers c ON c.trdr = cs.trdr
      LEFT JOIN m_partner_balances pb ON pb.trdr = cs.trdr AND pb.kind = 'R'
    measures:
      - name: count
        title: Πελάτες
        type: count
      - name: revenue_12m
        title: Τζίρος 12μήνου
        type: sum
        sql: revenue_12m
      - name: revenue_prev_12m
        title: Τζίρος προηγ. 12μήνου
        type: sum
        sql: revenue_prev_12m
      - name: margin_12m
        title: Μικτό κέρδος 12μήνου
        type: sum
        sql: margin_12m
      - name: balance
        title: Υπόλοιπο πελατών
        type: sum
        sql: balance
      - name: overdue_90
        title: Ανοιχτά > 90 ημερών
        type: sum
        sql: open_90_plus
      - name: overdue_61_90
        title: Ανοιχτά 61–90 ημερών
        type: sum
        sql: open_61_90
      - name: open_31_60
        title: Ανοιχτά 31–60 ημερών
        type: sum
        sql: open_31_60
      - name: open_0_30
        title: Ανοιχτά έως 30 ημέρες
        type: sum
        sql: open_0_30
      - name: invoiced_12m
        title: Τιμολογήσεις 12μήνου (με ΦΠΑ)
        type: sum
        sql: invoiced_12m
      - name: dso
        title: Ημέρες είσπραξης (DSO)
        description: Πόσες ημέρες πωλήσεων είναι ανείσπρακτες — υπόλοιπο πελατών / ημερήσιες τιμολογήσεις.
        type: number
        sql: "365.0 * SUM(GREATEST({CUBE}.balance, 0)) / NULLIF(SUM({CUBE}.invoiced_12m), 0)"
      - name: avg_payment_days
        title: Μέσες ημέρες πληρωμής (σταθμισμένες με τον τζίρο)
        type: number
        sql: "SUM({CUBE}.avg_payment_days * {CUBE}.invoiced_12m) / NULLIF(SUM(CASE WHEN {CUBE}.avg_payment_days IS NOT NULL THEN {CUBE}.invoiced_12m END), 0)"
      - name: at_risk_revenue
        title: Τζίρος πελατών σε κίνδυνο
        type: sum
        sql: revenue_prev_12m
        filters:
          - sql: "{CUBE}.churn_risk = 'Υψηλός'"
    dimensions:
      - name: trdr
        sql: trdr
        type: number
        primary_key: true
        public: false
      - name: customer_code
        title: Κωδικός πελάτη
        type: string
        sql: customer_code
      - name: customer_name
        title: Πελάτης
        type: string
        sql: COALESCE(customer_name, '—')
      - name: city
        title: Πόλη
        type: string
        sql: customer_city
      - name: segment
        title: Κατηγορία RFM
        type: string
        sql: segment
      - name: churn_risk
        title: Κίνδυνος απώλειας
        type: string
        sql: churn_risk
      - name: payment_grade
        title: Βαθμός πληρωμών (Α–Δ)
        type: string
        sql: payment_grade
      - name: payment_score
        title: Βαθμολογία πληρωμών (0–100)
        type: number
        sql: payment_score
      - name: payment_days
        title: Μέσες ημέρες πληρωμής
        type: number
        sql: avg_payment_days
      - name: dso
        title: DSO (ημέρες)
        type: number
        sql: dso_days
      - name: open_balance
        title: Υπόλοιπο (τιμή)
        type: number
        sql: balance
      - name: overdue_90_amount
        title: Ανοιχτά > 90 ημ. (τιμή)
        type: number
        sql: open_90_plus
      - name: revenue
        title: Τζίρος 12μ (τιμή)
        type: number
        sql: revenue_12m
      - name: revenue_prev
        title: Τζίρος προηγ. 12μ (τιμή)
        type: number
        sql: revenue_prev_12m
      - name: growth_percent
        title: Ανάπτυξη %
        type: number
        sql: growth_pct
      - name: margin_percent
        title: Περιθώριο %
        type: number
        sql: margin_pct
      - name: recency_days
        title: Ημέρες από την τελευταία αγορά
        type: number
        sql: recency_days
      - name: invoices_12m
        title: Παραστατικά 12μ
        type: number
        sql: invoices_12m
      - name: avg_days_between
        title: Μέσο διάστημα μεταξύ αγορών (ημέρες)
        type: number
        sql: avg_days_between_purchases
      - name: last_purchase
        title: Τελευταία αγορά
        type: time
        sql: last_purchase
      - name: expected_next_purchase
        title: Αναμενόμενη επόμενη αγορά
        type: time
        sql: expected_next_purchase
      - name: last_payment
        title: Τελευταία πληρωμή
        type: time
        sql: last_payment

  # ───────────────────────── Προμηθευτές ─────────────────────────
  - name: suppliers
    title: Προμηθευτές — αξιολόγηση
    description: >
      Μία γραμμή ανά προμηθευτή: αγορές 12μήνου και μερίδιο, ανάπτυξη, χρόνοι παράδοσης (από παραγγελία
      έως παραλαβή: μέσος, διάμεσος, 90% και διακύμανση), μεταβολή τιμών των ίδιων ειδών, υπόλοιπο και
      ημέρες που τον πληρώνουμε.
    sql: >
      SELECT ss.*, s.code AS supplier_code, s.name AS supplier_name, pb.balance, pb.open_90_plus, pb.avg_payment_days, pb.invoiced_12m
      FROM m_supplier_stats ss
      LEFT JOIN suppliers s ON s.trdr = ss.trdr
      LEFT JOIN m_partner_balances pb ON pb.trdr = ss.trdr AND pb.kind = 'P'
    measures:
      - name: count
        title: Προμηθευτές
        type: count
      - name: spend_12m
        title: Αγορές 12μήνου
        type: sum
        sql: spend_12m
      - name: balance
        title: Υπόλοιπο προμηθευτών
        type: sum
        sql: balance
      - name: dpo
        title: Ημέρες πληρωμής προμηθευτών (DPO)
        description: Υπόλοιπο προμηθευτών / ημερήσιες αγορές — πόσο γρήγορα πληρώνουμε.
        type: number
        sql: "365.0 * SUM(GREATEST({CUBE}.balance, 0)) / NULLIF(SUM({CUBE}.invoiced_12m), 0)"
      - name: avg_lead_days
        title: Μέσος χρόνος παράδοσης (σταθμισμένος)
        type: number
        sql: "SUM({CUBE}.lead_days_avg * {CUBE}.orders_received) / NULLIF(SUM(CASE WHEN {CUBE}.lead_days_avg IS NOT NULL THEN {CUBE}.orders_received END), 0)"
    dimensions:
      - name: trdr
        sql: trdr
        type: number
        primary_key: true
        public: false
      - name: supplier_code
        title: Κωδικός προμηθευτή
        type: string
        sql: supplier_code
      - name: supplier_name
        title: Προμηθευτής
        type: string
        sql: COALESCE(supplier_name, '—')
      - name: spend
        title: Αγορές 12μ (τιμή)
        type: number
        sql: spend_12m
      - name: spend_share
        title: Μερίδιο αγορών %
        type: number
        sql: spend_share_pct
      - name: spend_growth
        title: Ανάπτυξη αγορών %
        type: number
        sql: spend_growth_pct
      - name: orders_received
        title: Παραγγελίες που παραλήφθηκαν
        type: number
        sql: orders_received
      - name: lead_days_avg
        title: Μέσος χρόνος παράδοσης (ημέρες)
        type: number
        sql: lead_days_avg
      - name: lead_days_median
        title: Διάμεσος χρόνος παράδοσης
        type: number
        sql: lead_days_median
      - name: lead_days_p90
        title: Χρόνος παράδοσης 90%
        type: number
        sql: lead_days_p90
      - name: lead_days_stddev
        title: Διακύμανση χρόνου παράδοσης
        type: number
        sql: lead_days_stddev
      - name: price_change
        title: Μεταβολή τιμών % (ίδια είδη)
        type: number
        sql: price_change_pct
      - name: open_balance
        title: Υπόλοιπο (τιμή)
        type: number
        sql: balance
      - name: payment_days
        title: Ημέρες που πληρώνουμε
        type: number
        sql: avg_payment_days

  # ───────────────────────── Ταμειακά ─────────────────────────
  - name: cash_forecast
    title: Πρόβλεψη ταμειακών ροών (13 εβδομάδες)
    description: >
      Αναμενόμενες εισπράξεις (ανοιχτά πελατών) και πληρωμές (ανοιχτά προμηθευτών) ανά εβδομάδα, με βάση
      τον ρυθμό πληρωμής κάθε συναλλασσόμενου. Εβδομάδα 0 = τρέχουσα και εκπρόθεσμα.
    sql_table: m_cash_forecast
    measures:
      - name: inflow
        title: Αναμενόμενες εισπράξεις
        type: sum
        sql: inflow
      - name: outflow
        title: Αναμενόμενες πληρωμές
        type: sum
        sql: outflow
      - name: net
        title: Καθαρή ταμειακή ροή
        type: sum
        sql: net
    dimensions:
      - name: week
        title: Εβδομάδα
        type: number
        sql: week
        primary_key: true
      - name: week_start
        title: Αρχή εβδομάδας
        type: time
        sql: week_start

  - name: cash
    title: Ταμείο & τράπεζες ανά μήνα
    description: Εισροές, εκροές και υπόλοιπο λογαριασμών ταμείου/τραπεζών (38.xx) ανά μήνα.
    sql_table: m_cash_monthly
    measures:
      - name: inflow
        title: Εισροές
        type: sum
        sql: inflow
      - name: outflow
        title: Εκροές
        type: sum
        sql: outflow
      - name: balance
        title: Υπόλοιπο ταμείου/τραπεζών
        type: max
        sql: balance
    dimensions:
      - name: month
        title: Μήνας
        type: time
        sql: month
        primary_key: true

  - name: open_items
    title: Ανοιχτά παραστατικά πελατών & προμηθευτών
    description: Κάθε ανοιχτό (απλήρωτο) ποσό με ηλικία και αναμενόμενη ημερομηνία πληρωμής. kind R = πελάτης, P = προμηθευτής.
    sql: >
      SELECT o.*, COALESCE(c.name, s.name) AS partner_name
      FROM m_open_items o
      LEFT JOIN customers c ON o.kind = 'R' AND c.trdr = o.trdr
      LEFT JOIN suppliers s ON o.kind = 'P' AND s.trdr = o.trdr
    measures:
      - name: amount
        title: Ανοιχτό ποσό
        type: sum
        sql: amount
      - name: count
        title: Ανοιχτά παραστατικά
        type: count
    dimensions:
      - name: key
        sql: "kind || '-' || trdr::text || '-' || doc_date::text || '-' || amount::text"
        type: string
        primary_key: true
        public: false
      - name: kind
        title: Τύπος (R πελάτης, P προμηθευτής)
        type: string
        sql: kind
      - name: partner_name
        title: Συναλλασσόμενος
        type: string
        sql: COALESCE(partner_name, '—')
      - name: doc_date
        title: Ημερομηνία παραστατικού
        type: time
        sql: doc_date
      - name: expected_date
        title: Αναμενόμενη πληρωμή
        type: time
        sql: expected_date
      - name: age_days
        title: Ηλικία (ημέρες)
        type: number
        sql: age_days
