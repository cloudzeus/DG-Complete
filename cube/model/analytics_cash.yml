# Generated from the analytics model — one cube per file.
cubes:
  - name: cash
    title: Ταμείο & τράπεζες ανά μήνα
    description: Εισροές, εκροές και υπόλοιπο λογαριασμών ταμείου/τραπεζών (38.xx) ανά μήνα.
    sql_table: m_cash_monthly
    measures:
      - name: inflow
        title: Εισροές
        type: sum
        sql: inflow
      - name: outflow
        title: Εκροές
        type: sum
        sql: outflow
      - name: balance
        title: Υπόλοιπο ταμείου/τραπεζών
        type: max
        sql: balance
    dimensions:
      - name: key
        sql: "month::text"
        type: string
        primary_key: true
        public: false
      - name: month
        title: Μήνας
        type: time
        sql: month
