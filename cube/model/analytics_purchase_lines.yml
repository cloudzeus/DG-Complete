# Generated from the analytics model — one cube per file.
cubes:
  # ───────────────────────── Γραμμές αγορών ─────────────────────────
  - name: purchase_lines
    title: Αγορές ανά είδος
    description: Γραμμές τιμολογίων αγοράς ανά είδος και προμηθευτή (καθαρή αξία, πιστωτικά αρνητικά).
    sql: >
      SELECT f.*, i.code AS item_code, i.name AS item_name, c.name AS category_name, b.name AS brand_name,
             s.name AS supplier_name
      FROM f_purchase_lines f
      LEFT JOIN items i ON i.mtrl = f.mtrl
      LEFT JOIN item_categories c ON c.mtrcategory = i.mtrcategory
      LEFT JOIN brands b ON b.mtrmark = i.mtrmark
      LEFT JOIN suppliers s ON s.trdr = f.trdr
    measures:
      - name: amount
        title: Αξία αγορών
        type: sum
        sql: net
      - name: quantity
        title: Ποσότητα
        type: sum
        sql: qty
      - name: avg_price
        title: Μέση τιμή αγοράς
        type: number
        sql: "{amount} / NULLIF({quantity}, 0)"
      - name: documents
        title: Τιμολόγια αγοράς
        type: count_distinct
        sql: findoc
    dimensions:
      - name: line_key
        sql: "findoc::text || '-' || mtrlines::text"
        type: string
        primary_key: true
        public: false
      - name: date
        title: Ημερομηνία
        type: time
        sql: trndate
      - name: item_code
        title: Κωδικός είδους
        type: string
        sql: item_code
      - name: item_name
        title: Είδος
        type: string
        sql: COALESCE(item_name, '—')
      - name: category
        title: Εμπορική κατηγορία
        type: string
        sql: COALESCE(category_name, 'Χωρίς κατηγορία')
      - name: brand
        title: Μάρκα
        type: string
        sql: COALESCE(brand_name, 'Χωρίς μάρκα')
      - name: supplier_name
        title: Προμηθευτής
        type: string
        sql: COALESCE(supplier_name, '—')
